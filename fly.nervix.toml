app = 'nervix-platform'
primary_region = 'iad'

[build]
  dockerfile = './Dockerfile'

[env]
  NERVIX_PORT = '8080'
  NERVIX_PUBLIC_URL = 'https://nervix-platform.fly.dev'

[[services]]
  internal_port = 8080
  protocol = 'tcp'
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ['http']
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ['http', 'tls']
    port = 443

  [[services.http_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/health'
