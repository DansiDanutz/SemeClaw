name: Deploy Updates Manifest + Assets

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/pages/**"
      - "assets/**"
      - ".github/workflows/deploy-updates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy manifest to Cloudflare Pages
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare/pages --project-name=updates-semeclaw --branch=main

  upload-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Upload assets to R2
    needs: deploy-manifest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install boto3
        run: pip install boto3

      - name: Upload assets to R2
        run: python cloudflare/r2/upload-assets.py
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
