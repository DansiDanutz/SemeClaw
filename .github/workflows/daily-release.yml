name: Daily Release Pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Never ship what hasn't passed the suite — the release pipeline runs the
  # same checks as PR CI before anything is tagged or deployed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.1"

      - name: Sync dependencies
        run: uv sync --frozen --group dev || uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check src/ war_room/ adclaw/ nervix_platform/
          uv run ruff format --check src/ war_room/ adclaw/ nervix_platform/

      - name: Tests
        run: uv run pytest -q

  bump-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    outputs:
      new_version: ${{ steps.bump.outputs.NEW_VERSION }}
      new_tag: ${{ steps.bump.outputs.NEW_TAG }}
      changed: ${{ steps.bump.outputs.CHANGED }}
      manifest_sha: ${{ steps.bump.outputs.MANIFEST_SHA }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.1"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail

          # Skip the release entirely when nothing substantive changed since
          # the last tag — release-metadata churn (version fields, manifest,
          # lockfile version, badges, changelog headers) does not count.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ] && git diff --quiet "$LAST_TAG"..HEAD -- . \
              ':(exclude)pyproject.toml' \
              ':(exclude)uv.lock' \
              ':(exclude)cloudflare/pages/manifest.json' \
              ':(exclude)CHANGELOG.md' \
              ':(exclude)README.md'; then
            echo "No substantive changes since $LAST_TAG — skipping release."
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "CHANGED=true" >> "$GITHUB_OUTPUT"

          CURRENT=$(grep -oP '^version = "\K[^"]+' pyproject.toml)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          # Find next available patch version (skip existing tags)
          NEW_PATCH=$((PATCH + 1))
          while git ls-remote --tags origin "refs/tags/v${MAJOR}.${MINOR}.${NEW_PATCH}" | grep -q .; do
            NEW_PATCH=$((NEW_PATCH + 1))
          done

          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW_VERSION\"/" pyproject.toml
          uv lock 2>/dev/null || true

          # Versions are assigned here, not in PRs: promote any pending
          # [Unreleased] changelog section and refresh the README badge.
          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            sed -i "s/^## \[Unreleased\].*/## [$NEW_VERSION] - $(date -u +%Y-%m-%d)/" CHANGELOG.md
          fi
          sed -i "s/badge\/version-[0-9.]*-/badge\/version-$NEW_VERSION-/" README.md

          git add pyproject.toml uv.lock CHANGELOG.md README.md
          git commit -m "chore(release): bump version to $NEW_VERSION [daily]"
          git tag "$NEW_TAG"
          git push origin main --tags

          # The tag exists — hash the exact source archive clients will
          # download, then publish a manifest that lets them verify it.
          sleep 5
          ZIP_URL="https://github.com/DansiDanutz/SemeClaw/archive/refs/tags/$NEW_TAG.zip"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$ZIP_URL" -o /tmp/release.zip; then break; fi
            sleep $((attempt * 5))
          done
          SHA256=$(sha256sum /tmp/release.zip | cut -d' ' -f1)

          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" cloudflare/pages/manifest.json
          sed -i "s/\"download_url\": \"[^\"]*\"/\"download_url\": \"https:\/\/github.com\/DansiDanutz\/SemeClaw\/archive\/refs\/tags\/$NEW_TAG.zip\"/" cloudflare/pages/manifest.json
          sed -i "s/\"docker_image\": \"[^\"]*\"/\"docker_image\": \"ghcr.io\/dansidanutz\/semeclaw:$NEW_VERSION\"/" cloudflare/pages/manifest.json
          sed -i "s/\"released_at\": \"[^\"]*\"/\"released_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"/" cloudflare/pages/manifest.json
          sed -i "s/\"sha256\": \"[^\"]*\"/\"sha256\": \"$SHA256\"/" cloudflare/pages/manifest.json

          git add cloudflare/pages/manifest.json
          git commit -m "chore(release): publish manifest for $NEW_VERSION [daily]"
          git push origin main
          echo "MANIFEST_SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Bumped $CURRENT → $NEW_VERSION (zip sha256 $SHA256)"

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: bump-and-tag
    if: needs.bump-and-tag.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo name
        id: repo
        run: echo "LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push release image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.LOWER }}:${{ needs.bump-and-tag.outputs.new_version }}
            ghcr.io/${{ steps.repo.outputs.LOWER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # build-and-push must finish first so the manifest never advertises a
    # Docker image tag that has not been pushed yet.
    needs: [bump-and-tag, build-and-push]
    if: needs.bump-and-tag.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The manifest (with checksum) lives in the commit made after the
          # tag — deploy exactly that commit, not the tag.
          ref: ${{ needs.bump-and-tag.outputs.manifest_sha }}

      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/pages-action@f0a1cd58cd66095dee69bfa18fa5efd1dde93bca # v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: updates-semeclaw
          directory: cloudflare/pages
          branch: main

      - name: Verify live manifest
        env:
          DEPLOY_URL: ${{ steps.publish.outputs.url }}
          EXPECTED_VERSION: ${{ needs.bump-and-tag.outputs.new_version }}
        run: |
          set -euo pipefail
          # The manifest version-gate failure sat unnoticed for months
          # (clients saw 0.7.14 forever). Prove the deployed manifest
          # advertises this release, with a verifiable checksum.
          for attempt in 1 2 3 4 5 6; do
            LIVE=$(curl -fsSL "$DEPLOY_URL/manifest.json" || echo '{}')
            VERSION=$(echo "$LIVE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || echo "")
            SHA=$(echo "$LIVE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('checksums',{}).get('sha256',''))" 2>/dev/null || echo "")
            if [ "$VERSION" = "$EXPECTED_VERSION" ] && [ -n "$SHA" ]; then
              echo "OK: live manifest advertises $VERSION with sha256 $SHA"
              exit 0
            fi
            echo "attempt $attempt: live version='$VERSION' (want $EXPECTED_VERSION), sha256='${SHA:+set}' — retrying"
            sleep 20
          done
          echo "::error::Deployed manifest does not advertise $EXPECTED_VERSION with a checksum."
          exit 1

  deploy-fly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [bump-and-tag, build-and-push]
    if: needs.bump-and-tag.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag }}

      - name: Require AdClaw idempotency migration
        env:
          APPLIED_MIGRATION: ${{ vars.ADCLAW_IDEMPOTENCY_MIGRATION_APPLIED }}
        run: |
          if [ "$APPLIED_MIGRATION" != "2026_07_31" ]; then
            echo "::error::Apply war_room/db/migrations/2026_07_31_adclaw_idempotency.sql in Supabase, verify both RPCs, then set repository variable ADCLAW_IDEMPOTENCY_MIGRATION_APPLIED=2026_07_31."
            exit 1
          fi

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-07-25

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [bump-and-tag, build-and-push]
    if: needs.bump-and-tag.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.bump-and-tag.outputs.new_tag }}
          name: "SemeClaw ${{ needs.bump-and-tag.outputs.new_version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
