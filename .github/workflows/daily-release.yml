name: Daily Release Pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      new_version: ${{ steps.bump.outputs.NEW_VERSION }}
      new_tag: ${{ steps.bump.outputs.NEW_TAG }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.1"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        run: |
          CURRENT=$(grep -oP '^version = "\K[^"]+' pyproject.toml)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          # Find next available patch version (skip existing tags)
          NEW_PATCH=$((PATCH + 1))
          while git ls-remote --tags origin "refs/tags/v${MAJOR}.${MINOR}.${NEW_PATCH}" | grep -q .; do
            NEW_PATCH=$((NEW_PATCH + 1))
          done

          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW_VERSION\"/" pyproject.toml

          # Update manifest version
          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW_VERSION\"/" cloudflare/pages/manifest.json
          sed -i "s/\"download_url\": \"[^\"]*\"/\"download_url\": \"https:\/\/github.com\/DansiDanutz\/SemeClaw\/archive\/refs\/tags\/$NEW_TAG.zip\"/" cloudflare/pages/manifest.json
          sed -i "s/\"docker_image\": \"[^\"]*\"/\"docker_image\": \"ghcr.io\/dansidanutz\/semeclaw:$NEW_VERSION\"/" cloudflare/pages/manifest.json
          sed -i "s/\"released_at\": \"[^\"]*\"/\"released_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"/" cloudflare/pages/manifest.json

          git add pyproject.toml cloudflare/pages/manifest.json
          git commit -m "chore(release): bump version to $NEW_VERSION [daily]"
          git tag "$NEW_TAG"
          git push origin main --tags

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Bumped $CURRENT → $NEW_VERSION"

  deploy-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: bump-and-tag
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@f0a1cd58cd66095dee69bfa18fa5efd1dde93bca # v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: updates-semeclaw
          directory: cloudflare/pages
          branch: main

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: bump-and-tag
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo name
        id: repo
        run: echo "LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push release image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.LOWER }}:${{ needs.bump-and-tag.outputs.new_version }}
            ghcr.io/${{ steps.repo.outputs.LOWER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-fly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [bump-and-tag, build-and-push]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag }}

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-07-25

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [bump-and-tag, build-and-push]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.bump-and-tag.outputs.new_tag }}
          name: "SemeClaw ${{ needs.bump-and-tag.outputs.new_version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
