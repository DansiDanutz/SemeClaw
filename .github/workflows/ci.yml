name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Smoke test — meeting_skill module
        run: |
          uv run python -c "
          from war_room.dashboard.meeting_skill import build_script
          script = build_script(
              report_content='# Report\n**Task:** test\n## Research Agent\nfindings',
              task='test',
              meeting_id='abc12345',
          )
          assert script.subject == 'test'
          assert len(script.segments) >= 4
          print('meeting_skill OK:', len(script.segments), 'segments')
          "

      - name: Smoke test — server boots + manifest responds
        run: |
          uv run python war_room/dashboard/server.py &
          SERVER_PID=$!
          sleep 6
          curl -sf http://127.0.0.1:8765/api/agent/manifest > /tmp/manifest.json
          cat /tmp/manifest.json | python -c "import sys,json; d=json.load(sys.stdin); assert d['version']=='0.2.0'; print('OK:', d['id'])"
          curl -sf http://127.0.0.1:8765/api/agent/health > /tmp/health.json
          curl -sf http://127.0.0.1:8765/metrics | head -5
          kill $SERVER_PID || true
        env:
          SEMECLAW_API_KEY: ""
          ELEVENLABS_API_KEY: ""
          OPENROUTER_API_KEY: ""

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: semeclaw:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version + lowercase owner
        id: v
        run: |
          echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/semeclaw:${{ steps.v.outputs.tag }}
            ghcr.io/${{ steps.v.outputs.owner }}/semeclaw:latest
