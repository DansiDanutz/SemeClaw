name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Reject tracked runtime artifacts
        run: |
          forbidden=$(git ls-files \
            'war_room/logs/*.log' \
            'war_room/logs/*.jsonl' \
            'war_room/audio/_test.mp3' \
            'war_room/audio/meetings/*.mp3' \
            'war_room/audio/meetings/saved/*.mp3' \
            'war_room/audio/scripts/*.json' \
            'war_room/memory/memory.json' \
            'war_room/shared_state.json' \
            'war_room/research/*.md' \
            'war_room/builds')
          forbidden=$(printf '%s\n' "$forbidden" | grep -v '^war_room/research/saved/' || true)
          if [ -n "$forbidden" ]; then
            echo 'Tracked runtime artifacts detected:'
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Lint with ruff
        run: |
          uv run ruff check src/ war_room/ || true
          uv run ruff format --check src/ war_room/ || true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run full pytest suite
        run: uv run pytest -q

      - name: Smoke test — meeting_skill module
        run: |
          uv run python -c "
          from war_room.dashboard.meeting_skill import build_script
          script = build_script(
              report_content='# Report\n**Task:** test\n## Research Agent\nfindings',
              task='test',
              meeting_id='abc12345',
          )
          assert script.subject == 'test'
          assert len(script.segments) >= 4
          print('meeting_skill OK:', len(script.segments), 'segments')
          "

      - name: Smoke test — semeclaw demo runs
        run: |
          uv run semeclaw demo | tee /tmp/demo.log
          grep -q "Demo complete" /tmp/demo.log
          grep -q "Dexter" /tmp/demo.log
          grep -q "Memo" /tmp/demo.log
          grep -q "Hermes" /tmp/demo.log
          echo "✓ semeclaw demo smoke test passed"

      - name: Smoke test — server boots + manifest responds
        run: |
          uv run semeclaw war-room &
          SERVER_PID=$!
          sleep 6
          curl -sf http://127.0.0.1:8765/api/agent/manifest > /tmp/manifest.json
          cat /tmp/manifest.json | python -c "import sys,json,re; d=json.load(sys.stdin); assert d['id']=='semeclaw-war-room'; assert re.match(r'^\d+\.\d+\.\d+$', d['version']); assert len(d['capabilities'])>=10; print('OK:', d['id'], 'v'+d['version'], 'caps='+str(len(d['capabilities'])))"
          curl -sf http://127.0.0.1:8765/api/agent/health > /tmp/health.json
          curl -sf http://127.0.0.1:8765/agents | head -5
          curl -sf http://127.0.0.1:8765/embed.js | head -3
          kill $SERVER_PID || true
        env:
          SEMECLAW_API_KEY: ""
          ELEVENLABS_API_KEY: ""
          OPENROUTER_API_KEY: ""

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: semeclaw:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version + lowercase owner
        id: v
        run: |
          echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/semeclaw:${{ steps.v.outputs.tag }}
            ghcr.io/${{ steps.v.outputs.owner }}/semeclaw:latest
