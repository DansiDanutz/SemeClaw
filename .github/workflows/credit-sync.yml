name: Daily Credit Sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install deps
        run: uv sync --frozen || uv sync

      - name: Run credit sync
        env:
          NERVIX_API_BASE: ${{ secrets.NERVIX_API_BASE }}
          NERVIX_API_KEY: ${{ secrets.NERVIX_API_KEY }}
          DLS_TEAM_SUPABASE_URL: ${{ secrets.DLS_TEAM_SUPABASE_URL }}
          DLS_TEAM_SUPABASE_SERVICE_KEY: ${{ secrets.DLS_TEAM_SUPABASE_SERVICE_KEY }}
        run: uv run python scripts/credit_sync.py
