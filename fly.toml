# SemeClaw War Room Agent — Fly.io deploy config
#
# Quickstart:
#   brew install flyctl
#   fly launch --copy-config --no-deploy
#   fly secrets set ELEVENLABS_API_KEY=... OPENROUTER_API_KEY=... SEMECLAW_API_KEY=...
#   fly deploy
#
# The container pulls ghcr.io/dansidanutz/semeclaw:latest automatically.
# For pinned releases change the image tag.

app = "semeclaw"
primary_region = "iad"            # change to your nearest region

[build]
  dockerfile = "Dockerfile"

[env]
  SEMECLAW_PUBLIC_URL     = "https://semeclaw.fly.dev"
  SEMECLAW_CORS_ORIGINS   = "*"
  SEMECLAW_FRAME_ANCESTORS = "*"
  SEMECLAW_TENANT_ID      = "default"
  WAR_ROOM_DIR            = "/app/war_room"

# Secrets (set via `fly secrets set ...`):
#   ANTHROPIC_API_KEY   — primary LLM (Claude)
#   OPENROUTER_API_KEY  — fallback LLM
#   SEMECLAW_API_KEY    — server auth (optional)
#   SUPABASE_URL        — data persistence
#   SUPABASE_KEY        — Supabase service key
#   TELEGRAM_BOT_TOKEN  — Telegram channel (optional)

[[services]]
  protocol = "tcp"
  internal_port = 8765

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[services.tcp_checks]]
    interval = "15s"
    timeout  = "3s"
    grace_period = "10s"

  [[services.http_checks]]
    interval = "30s"
    timeout  = "5s"
    method   = "get"
    path     = "/api/agent/health"
    protocol = "http"
    grace_period = "15s"

[[mounts]]
  source      = "semeclaw_data"
  destination = "/app/data"
  # Persists meeting audio, reports, webhooks.json, shares.json, tenant data

[deploy]
  strategy = "rolling"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "1024mb"
