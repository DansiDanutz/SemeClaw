[project]
name = "semeclaw"
version = "0.7.5"
description = "SemeClaw — embeddable AI War Room agent powering cinematic multi-agent meetings for NERVIX + Paperclip companies."
requires-python = ">=3.10"

dependencies = [
    "litellm>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-telegram-bot>=20.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
    "watchdog>=3.0.0",
    "croniter>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "trafilatura>=1.6.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "yt-dlp>=2024.1.1",
    "supabase>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "edge-tts>=7.2.8",
    "markitdown>=0.1.0",
    "stripe>=9.0.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "email-validator>=2.0.0",
    "kokoro-onnx>=0.5.0",
    "faster-whisper>=1.1.0",
    "soundfile>=0.12.0",
    "onnxruntime>=1.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semeclaw"]

[project.scripts]
semeclaw = "semeclaw.cli.main:app"
