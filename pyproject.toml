[project]
name = "semeclaw"
version = "0.1.0"
description = "SemeClaw - The AI Brain of DansLab Company"
requires-python = ">=3.10"

dependencies = [
    "litellm>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-telegram-bot>=20.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
    "watchdog>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semeclaw"]

[project.scripts]
semeclaw = "semeclaw.cli.main:app"
