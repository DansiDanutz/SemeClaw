# SemeClaw - NERVIX AI Brain Configuration
# Auto-configured with live API keys

llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  api_key: "your-anthropic-api-key"
  api_base: null
  temperature: 0.7
  max_tokens: 4096
  fallbacks:
    - provider: openrouter
      model: openrouter/anthropic/claude-sonnet-4
      api_key: "your-openrouter-api-key"
      api_base: https://openrouter.ai/api/v1
      temperature: 0.7
      max_tokens: 4096

default_agent: seme

